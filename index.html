<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-family: system-ui, sans-serif;
      background: #f4f6fb;
      color: #1c2333;
    }
    h1 { font-size: 3rem; margin: 0; }
    button {
      padding: 12px 28px;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      background: #4f6df5;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #3b56d9; }
  </style>
</head>
<body>
  <h1 id="title">Hello, Yarik!</h1>
  <button id="btn">Нажми меня</button>

  <script>
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('title').textContent = 'Привет, Yarik! 👋';
    });
  </script>
</body>
</html>
